name: Release

# Publishes the standalone @ranchbot/mcp-server package when a stable vX.Y.Z tag is
# pushed. `NPM_RELEASE_ENABLED=true` must be a repository variable; absent or
# false blocks all publication without failing ordinary pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases per repository. Never cancel a run that may be publishing.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release readiness gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require NPM_RELEASE_ENABLED=true
        id: flag
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: node scripts/release/main.mjs gate

  validate:
    name: Validate tag and versions
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Tag commit must belong to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate tag, repository identity, and versions
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/main.mjs validate-tag

  ci:
    name: Reusable CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  candidate:
    name: Build and verify candidate
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      filename: ${{ steps.check.outputs.filename }}
      integrity: ${{ steps.check.outputs.integrity }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack exactly once
        run: npm pack --json > pack-result.json

      - name: Inspect tarball and write manifest
        id: check
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release/main.mjs check-tarball

      - name: Install the exact tarball in a clean environment
        run: |
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/${{ steps.check.outputs.filename }}"
          node "$GITHUB_WORKSPACE/scripts/release/smoke.mjs" \
            "./node_modules/.bin/ranchbot-mcp" "${{ needs.validate.outputs.version }}"

      - name: Retain the release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            ${{ steps.check.outputs.filename }}
            release-manifest.json
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [validate, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require npm 11.5.1+ for trusted publishing
        run: |
          npm install --global npm@11.5.1
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) { console.error('npm '+v.join('.')+' < 11.5.1'); process.exit(1); } console.log('npm '+v.join('.'));"

      - name: Download the verified candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate

      - name: Check the registry state
        id: registry
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
        run: node scripts/release/main.mjs registry-status

      - name: Publish the exact tested tarball
        if: steps.registry.outputs.publish == 'true'
        run: >-
          npm publish "candidate/${{ needs.candidate.outputs.filename }}"
          --access public --tag latest --provenance

      - name: Verify the published registry entry
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
        run: node scripts/release/main.mjs verify-registry

  github-release:
    name: Create GitHub release
    needs: [validate, candidate, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download the verified candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate

      - name: Generate change notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="${{ needs.validate.outputs.tag }}" \
            -f target_commitish="${{ needs.validate.outputs.sha }}" \
            --jq .body > generated-notes.md

      - name: Render release notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
        run: node scripts/release/main.mjs render-notes --generated-notes generated-notes.md

      - name: Create or complete the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          node scripts/release/main.mjs github-release \
            --tag "${{ needs.validate.outputs.tag }}" \
            --sha "${{ needs.validate.outputs.sha }}" \
            --title "${{ needs.validate.outputs.tag }}" \
            --notes-file release-notes.md \
            --version "${{ needs.validate.outputs.version }}" \
            --integrity "${{ needs.candidate.outputs.integrity }}" \
            --filename "${{ needs.candidate.outputs.filename }}" \
            --asset "candidate/${{ needs.candidate.outputs.filename }}" \
            --asset candidate/release-manifest.json
